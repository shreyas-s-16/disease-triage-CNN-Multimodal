# Thermal Encoder Full Pretraining Config
data:
  root_dir: "data/thermal/raw/terravic"
  image_size: 224
  subset_frac: 1.0
  splits_path: "data/thermal/processed/splits.csv"

model:
  pretrained: true
  frozen: false
  output_dim: 512
  proj_dim: 128

training:
  batch_size: 64
  lr: 1e-4
  weight_decay: 1e-4
  epochs: 100
  checkpoint_dir: "checkpoints/thermal"
  save_every: 10
  num_workers: 4
  temperature: 0.5
  early_stopping_patience: 5
  early_stopping_min_delta: 1e-4

seed: 42