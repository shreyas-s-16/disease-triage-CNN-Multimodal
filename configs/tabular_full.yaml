# Tabular Baseline Full Training Config
data:
  dataset_path: "data/tabular/raw/dataset.csv"
  severity_path: "data/tabular/raw/Symptom-severity.csv"
  subset_frac: 1.0
  splits_path: "data/tabular/processed/splits.csv"

model:
  hidden_dims: [1024, 512, 256]
  output_dim: 256
  dropout: 0.4

training:
  batch_size: 128
  lr: 1e-3
  weight_decay: 1e-4
  epochs: 100
  checkpoint_dir: "checkpoints/tabular"
  save_every: 10
  num_workers: 0
  early_stopping_patience: 5
  early_stopping_min_delta: 1e-4

seed: 42